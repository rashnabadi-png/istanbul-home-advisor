<style>

:root[data-theme="dark"]{

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{min-width:0;display:grid}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.4rem;margin:0}
.brand span{color:var(--muted);font-size:.82rem}
.spacer{flex:1}
.lang{display:flex;gap:4px;flex-wrap:wrap}
.lang button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.log{overflow-y:auto;padding-block:18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
[dir="rtl"] .msg.bot{border-bottom-left-radius:16px;border-bottom-right-radius:4px}
[dir="rtl"] .msg.me{border-bottom-right-radius:16px;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg.note{align-self:center;max-width:none;color:var(--muted);font-size:.82rem;padding:2px 8px}
.msg .why{display:block;color:var(--muted);font-size:.84rem;margin-top:4px}
.progress{align-self:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.recs{align-self:stretch;display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:7px}
.card h3{margin:0;font-size:1.02rem;text-wrap:balance}
.where{color:var(--muted);font-size:.85rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 14px;font-size:.86rem}
.facts div span{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.price{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.fit{font-size:.86rem;background:var(--sunk);border-radius:10px;padding:6px 10px}
.src{font-size:.74rem;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.risk{background:var(--risk-bg);color:var(--risk)}
.cardacts{display:flex;gap:8px;flex-wrap:wrap}
.replies{display:flex;gap:8px;flex-wrap:wrap;padding-block:10px 4px}
.reply{border:1px solid var(--tile);color:var(--tile);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.reply.alt{border-color:var(--line);color:var(--muted);font-weight:500}
.reply[aria-pressed="true"]{background:var(--tile);color:#fff}
.dock{border-top:1px solid var(--line);padding-block:6px 12px;background:var(--bg)}
.composer{display:flex;gap:8px}
.composer textarea,.composer input{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:44px;max-height:120px;min-width:0}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.82rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.foot{font-size:.72rem;color:var(--muted);padding-top:6px}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
@media (max-width:560px){.msg{max-width:94%}.brand span{display:none}}

CITIZENSHIP BY REAL ESTATE (checked ${KB_CHECKED})
- Minimum investment: USD 400,000 in real estate (one property or several combined). Each property must be valued by a licensed appraiser (valuation report); the appraised value, not the asking price, counts.
- The buyer must not sell the property for 3 years; this is written on the title deed.
- Payment must be made in foreign currency and converted through a Turkish bank (foreign currency purchase document, "DAB"). The money used for the threshold cannot be a mortgage from a Turkish bank.
- The seller must be a Turkish citizen or a Turkish company.
- Spouse and children under 18 can be included.
- Since August 2026 authorities have revoked thousands of citizenships obtained with inflated valuations, and several developers and appraisers are under investigation. Buyers should rely only on independent valuations and documented payments.
- Turkey's "secure payment system" for property sales (payment held until the deed transfer) had its mandatory start postponed to 1 October 2026; confirm the current status with your agent or lawyer.

RESIDENCE PERMIT
- Buying property can support a short-term residence permit. The property value rules and the list of neighbourhoods closed to new foreign residents change; an agent checks the specific address before you buy.

TITLE DEEDS (TAPU)
- "Kat mülkiyeti" = full condominium title (building completed and registered). "Kat irtifakı" = construction-servitude title used for off-plan or not-yet-registered buildings; it is converted after completion.
- Title deed transfer fee is usually 4% of the declared value, by law split between buyer and seller, though developers often ask the buyer to pay it or advertise it as included or exempt — confirm in the contract.
- Under-declaring the price on the deed is illegal and makes citizenship applications fail. Never agree to "pay the rest in cash".

TAXES AND COSTS ON NEW HOMES
- VAT on new residential units depends on size, location and buyer status (rates from 1% to 20% apply). Some foreign buyers can get a VAT exemption when paying in foreign currency. Confirm the rate for the exact unit.
- Typical extra costs: valuation report, notary and translation, utility subscriptions, annual property tax, building maintenance fee (aidat).

BUYING STEPS (typical)
1) Choose a unit and get the price list and payment plan in writing. 2) Reservation or deposit. 3) Sales contract (notarised for off-plan). 4) Valuation report. 5) Payment through a Turkish bank. 6) Title deed transfer at the land registry. 7) For citizenship: application through the land registry certificate and the immigration office.

/* ===== Conversation script (options: [textKey, value]) ===== */
const BUDGETS = {"u250":[0,250000],"250-400":[250000,400000],"400-600":[400000,600000],"600-1m":[600000,1000000],"1-2m":[1000000,2000000],"2m+":[2000000,1e12]};
const FAM = [["o_fam_single","single"],["o_fam_couple","couple"],["o_fam_family","family"],["o_unsure","unsure"]];
const S = {
  start:{say:"start", options:[["o_citizenship","citizenship"],["o_rental","rental"],["o_living","living"],["o_holiday","holiday"],["o_investment","investment"],["o_project","project"],["o_legal","legal"],["o_explore","explore"]],
    next:v=>({citizenship:"cit_know",rental:"rent_kind",living:"live_who",holiday:"hol_use",investment:"inv_horizon",project:"proj_name",legal:"legal_topic",explore:"exp_intro"}[v])},
  cit_know:{say:"cit_know", options:[["o_know_yes","yes"],["o_know_no","no"]], next:v=> v==="no" ? "cit_explain" : "cit_family"},
  cit_explain:{say:"cit_explain", options:FAM, key:"family", next:"cit_combine"},
  cit_family:{say:"cit_family", options:FAM, key:"family", next:"cit_combine"},
  cit_combine:{say:"cit_combine", options:[["o_one","one"],["o_combine","combine"],["o_either_agent","either"]], key:"combine", next:"cit_timeline"},
  cit_timeline:{say:"cit_timeline", options:[["o_asap","asap"],["o_6m","6m"],["o_12m","12m"],["o_later","later"]], key:"citTime", next:v=>{ if (v==="asap"||v==="6m") A.timing="ready"; return "nationality"; }},
  rent_kind:{say:"rent_kind", options:[["o_short","short"],["o_long","long"],["o_advise","unsure"]], key:"rentKind", next:"rent_manage"},
  rent_manage:{say:"rent_manage", options:[["o_managed","yes"],["o_self","no"],["o_maybe_later","maybe"]], key:"manage", next:"rent_tenant"},
  rent_tenant:{say:"rent_tenant", options:[["o_business","business"],["o_students","students"],["o_families","families"],["o_tourists","tourists"]], multi:true, key:"tenants", next:"nationality"},
  live_who:{say:"live_who", options:[["o_single","single"],["o_couple","couple"],["o_family","family"],["o_retire","retire"]], key:"household", next:v=> v==="family" ? "live_school" : "live_work"},
  live_school:{say:"live_school", options:[["o_school_yes","yes"],["o_nice","nice"],["o_no","no"]], key:"schools", next:"live_work"},
  live_work:{say:"live_work", options:[["o_levent","levent"],["o_atasehir","atasehir"],["o_remote","remote"],["o_notdecided","unsure"]], key:"work", next:"live_ready"},
  live_ready:{say:"live_ready", options:[["o_ready_only","ready"],["o_can_wait","any"]], key:"timing", next:"nationality"},
  hol_use:{say:"hol_use", options:[["o_weeks","weeks"],["o_months","months"],["o_half","half"]], key:"stay", next:"hol_rent"},
  hol_rent:{say:"hol_rent", options:[["o_yes","yes"],["o_no","no"],["o_maybe","maybe"]], key:"rentAway", next:"nationality"},
  inv_horizon:{say:"inv_horizon", options:[["o_h_short","short"],["o_h_mid","mid"],["o_h_long","long"]], key:"horizon", next:"inv_risk"},
  inv_risk:{say:"inv_risk", options:[["o_offplan","offplan"],["o_near","near"],["o_ready_deed","ready"]], key:"risk", next:v=>{ if (v==="ready") A.timing="ready"; return "nationality"; }},
  exp_intro:{say:"exp_intro", options:[["o_value","value"],["o_view","view"],["o_metro","metro"],["o_green","green"]], multi:true, key:"priorities", next:"nationality"},
  nationality:{say:"nationality", input:true, key:"country", ph:"ph_country", next:"budget"},
  budget:{say:()=> A.goal==="citizenship" ? "budget_cit" : "budget",
    options:()=>Object.keys(BUDGETS).filter(k=> A.goal!=="citizenship" || !["u250","250-400"].includes(k) || A.combine==="combine").map(k=>["b_"+k,k]).concat([["o_type","type"]]), key:"budget",
    next:v=> v==="type" ? "budget_type" : "payment"},
  budget_type:{say:"budget_type", input:true, key:"budgetText", ph:"ph_budget", next:"payment"},
  payment:{say:"payment", options:[["o_cash","cash"],["o_plan","plan"],["o_unsure","unsure"]], key:"payment", next:"side"},
  side:{say:"side", options:[["o_european","european"],["o_asian","asian"],["o_any","any"],["o_area","area"]], key:"side", next:v=> v==="area" ? "area" : "rooms"},
  area:{say:"area", input:true, key:"area", ph:"ph_area", next:"rooms"},
  rooms:{say:"rooms", options:[["o_r1","1"],["o_r2","2"],["o_r3","3"],["o_r4","4"],["o_villa","villa"],["o_flex","any"]], key:"rooms", next:"timing", skip:()=> A.goal==="citizenship" && A.combine==="combine"},
  timing:{say:"timing", options:[["o_now","ready"],["o_year","year"],["o_offok","any"]], key:"timing", next:"priorities", skip:()=> !!A.timing},
  priorities:{say:"priorities", options:[["o_p_view","view"],["o_p_metro","metro"],["o_p_green","green"],["o_p_fac","facilities"],["o_p_airport","airport"],["o_p_value","value"]], multi:true, key:"priorities", next:"recommend", skip:()=> !!A.priorities},
  proj_name:{say:"proj_name", input:true, key:"projectQuery", ph:"ph_project", next:"proj_answer"},
  legal_topic:{say:"legal_topic", options:[["o_l_cit","cit"],["o_l_deed","deed"],["o_l_tax","tax"],["o_l_res","res"],["o_l_steps","steps"],["o_l_pay","pay"]], key:"legal", next:"legal_answer"},
};
const PROGRESS = ["nationality","budget","payment","side","rooms","timing","priorities"];

/* ===== Recommendation engine ===== */
function budgetRange(){
  if (A.budget && BUDGETS[A.budget]) return BUDGETS[A.budget];
  const s = String(A.budgetText||"").toLowerCase().replace(/[,\s]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
  const m = s.match(/([\d.]+)(k|m|million|milyon|млн|тыс|thousand|bin|هزار|میلیون|مليون|ألف|الف)?/); if (!m) return null;
  let n = parseFloat(m[1]); const u = m[2]||"";
  if (/^(m|million|milyon|млн|میلیون|مليون)/.test(u)) n*=1e6; else if (u) n*=1e3; else if (n < 10000) n*=1000;
  return [n*0.6, n*1.1];
}
const hasRooms = (p,r) => { const s = (p.unitTypes+" "+p.type).toLowerCase(); if (r==="villa") return /villa/.test(s); if (r==="4") return /[4-9]\+\d/.test(s); if (r==="1") return /1\+1|studio|1\+0/.test(s); return s.includes(r+"+1"); };
function rank(){
  const br = budgetRange(); const pri = A.priorities||[]; const out = [];
  for (const p of P){
    let s = {high:4, medium:2, low:-1}[p.conf] ?? -2; const why = [];
    const txt = (p.desc+" "+p.views+" "+p.fac+" "+p.transport+" "+p.district+" "+p.hood).toLowerCase();
    if (A.side && A.side!=="any" && A.side!=="area" && !String(p.side).toLowerCase().includes(A.side)) continue;
    if (A.area){ const a = A.area.toLowerCase(); if ((p.district+" "+p.hood).toLowerCase().includes(a)) { s+=5; why.push(t("why_in",{x:p.district})); } else s-=3; }
    if (A.timing==="ready"){ if (!/ready|delivered|completed/i.test(p.status+" "+p.delivery)) continue; why.push(t("why_ready")); }
    if (br){ if (!p.fromUSD) s-=2; else if (p.fromUSD < br[0]*0.7 || p.fromUSD > br[1]) continue; else { s+=3; why.push(t("why_starts",{x:money(p.fromUSD)})); } }
    if (A.goal==="citizenship"){ if (/^no\b/i.test(p.cit)) continue; if (/^yes/i.test(p.cit)) { s+=3; why.push(t("why_cit")); } else if (/bundle/i.test(p.cit) && A.combine!=="one") { s+=1; why.push(t("why_combine")); } else if (A.combine==="one") s-=3; }
    const bf = (p.bestFor||[]).join(" ").toLowerCase();
    const tag = {citizenship:"citizenship", rental:"rental", living:"family", holiday:"luxury", investment:"investment"}[A.goal];
    if (tag && bf.includes(tag)) { s+=2; why.push(t("why_good_"+tag)); }
    if (A.rooms && A.rooms!=="any"){ if (hasRooms(p,A.rooms)) { s+=2; why.push(t("why_has"+A.rooms)); } else s-=2; }
    if (pri.includes("view") && /sea|bosphorus|deniz|boğaz|lake/.test(txt)) { s+=2; why.push(t("why_view")); }
    if (pri.includes("metro") && /metro|marmaray|metrobus|tram/.test(txt)) { s+=2; why.push(t("why_metro")); }
    if (pri.includes("green") && /green|forest|park|garden|quiet/.test(txt)) { s+=1; why.push(t("why_green")); }
    if (pri.includes("facilities") && /pool|gym|spa|fitness/.test(txt)) { s+=1; why.push(t("why_fac")); }
    if (pri.includes("airport") && /airport/.test(txt)) s+=1;
    if (A.schools==="yes" && /school|college|kolej|university/.test(txt)) { s+=2; why.push(t("why_school")); }
    if (A.work==="levent" && /levent|maslak|şişli|sisli|beşiktaş|besiktas|kağıthane|kagithane|sarıyer|sariyer/.test(txt)) { s+=2; why.push(t("why_levent")); }
    if (A.work==="atasehir" && /ataşehir|atasehir|kadıköy|kadikoy|ümraniye|umraniye|üsküdar|uskudar/.test(txt)) { s+=2; why.push(t("why_atasehir")); }
    if (A.rentKind==="short" && /airbnb|tourist|taksim|beyoğlu|beyoglu|sultanahmet/.test(txt)) { s+=2; why.push(t("why_short")); }
    if (A.risk==="offplan" && /off-plan|under construction/i.test(p.status)) s+=2;
    if (p.risk.includes("developer-investigation")) s-=6;
    if (p.risk.includes("no-developer-stock")) s-=3;
    out.push({p, s, why:[...new Set(why)].slice(0,3)});
  }
  return out.sort((a,b)=>b.s-a.s);
}

/* ===== UI ===== */
function scrollDown(){ const l = $("#log"); requestAnimationFrame(()=> l.scrollTop = l.scrollHeight); }
function addMsg(kind, text){ const d = document.createElement("div"); d.className = "msg "+kind; d.dir = "auto"; d.textContent = text; $("#log").append(d); scrollDown(); return d; }
function card(r){
  const p = r.p, b = [];
  if (/ready|delivered|completed/i.test(p.status)) b.push(`<span class="badge ok">${t("badge_ready")}</span>`); else if (p.status) b.push(`<span class="badge">${esc(p.status)}</span>`);
  if (/^yes/i.test(p.cit)) b.push(`<span class="badge ok">${t("badge_cit")}</span>`); else if (/bundle/i.test(p.cit)) b.push(`<span class="badge warn">${t("badge_combine")}</span>`);
  if (p.risk.includes("no-developer-stock")) b.push(`<span class="badge warn">${t("badge_resale")}</span>`);
  if (p.risk.includes("developer-investigation")) b.push(`<span class="badge risk">${t("badge_review")}</span>`);
  if (p.conf==="low") b.push(`<span class="badge warn">${t("badge_confirm")}</span>`);
  return `<article class="card" data-id="${esc(p.id)}" dir="auto">
    <h3 dir="ltr">${esc(p.name)}</h3>
    <div class="where" dir="ltr">${esc([p.district,p.hood].filter(Boolean).join(" · "))}${p.dev? " · "+esc(p.dev):""}</div>
    <div class="badges">${b.join("")}</div>
    <div class="facts"><div><span>${t("card_from")}</span><b class="price">${esc(money(p.fromUSD) || t("price_req"))}</b></div><div><span>${t("card_homes")}</span><bdi>${esc(p.unitTypes||"—")}</bdi></div><div><span>${t("card_delivery")}</span><bdi>${esc(p.delivery||p.status||"—")}</bdi></div></div>
    ${r.why.length? `<div class="fit">${esc(t("card_why",{x:r.why.join(L==="ar"||L==="fa"?"، ":", ")}))}</div>`:""}
    ${p.priceSrc? `<div class="src">${esc(t("card_src",{x:p.priceSrc}))}</div>`:""}
    <div class="cardacts"><button class="btn small ghost more" type="button">${t("card_more")}</button><button class="btn small ghost agent" type="button">${t("card_prices")}</button></div>
  </article>`;
}
function showCards(list){ const d = document.createElement("div"); d.className = "recs"; d.innerHTML = list.map(card).join(""); $("#log").append(d); scrollDown(); }
function setReplies(opts, multi){
  const r = $("#replies"); r.innerHTML = "";
  (opts||[]).forEach(([key, value, cls]) => { const b = document.createElement("button"); b.type="button"; b.className="reply"+(cls?" "+cls:""); b.textContent=t(key); b.dataset.v=value; if (multi) b.setAttribute("aria-pressed","false"); r.append(b); });
  if (multi){ const d = document.createElement("button"); d.type="button"; d.className="reply"; d.textContent=t("done"); d.dataset.done="1"; r.append(d); }
}
const val = x => typeof x === "function" ? x() : x;
function setPh(k){ $("#input").placeholder = t(k || "placeholder"); }

/* ===== Flow engine ===== */
function go(id){
  step = id; const st = S[id]; if (!st) return;
  if (st.skip && st.skip()) return go(typeof st.next==="function" ? st.next(A[st.key]) : st.next);
  addMsg("bot", t(val(st.say), {date:KB_CHECKED}));
  const n = PROGRESS.indexOf(id); if (n >= 0){ const p = document.createElement("div"); p.className="progress"; p.textContent = t("progress",{n:n+1}); $("#log").append(p); }
  if (st.input){ setReplies([["skip","__skip","alt"]]); setPh(st.ph || "placeholderAnswer"); $("#input").focus(); }
  else setReplies(val(st.options), st.multi);
}
function answer(value, label){
  const st = S[step]; if (!st) return;
  addMsg("me", label);
  if (st.key) A[st.key] = value;
  if (step==="start") A.goal = value;
  setPh();
  const nxt = typeof st.next==="function" ? st.next(value) : st.next;
  if (nxt==="recommend") return recommend();
  if (nxt==="proj_answer") return projectAnswer(value);
  if (nxt==="legal_answer") return legalAnswer(value);
  setTimeout(()=>go(nxt), 250);
}
function recommend(){
  step = "results"; const r = rank(); const top = r.slice(0,3);
  if (!top.length){ addMsg("bot", t("none")); setReplies([["a_widen","widen"],["a_anyside","anyside"],["a_offplan","offplan"],["a_agent","lead"]]); return; }
  addMsg("bot", summaryLine() + "\n\n" + t("top",{n:top.length}));
  showCards(top); window._ranked = r; window._shown = 3;
  setReplies([["a_more","more"],["a_compare","compare"],["a_change","change"],["a_prices","lead"]]);
}
function summaryLine(){
  const goal = t("g_"+(A.goal||"default"));
  const bud = A.budget && BUDGETS[A.budget] ? t("b_"+A.budget) : (A.budgetText || t("open_budget"));
  const side = A.area ? A.area : t("s_"+({european:"european",asian:"asian"}[A.side]||"any"));
  return t("summary",{goal, budget:bud, side, ready: A.timing==="ready" ? t("summary_ready") : ""});
}
function projectAnswer(q){
  step = "after"; const hits = lookupName(q);
  if (!hits.length){ addMsg("bot", t("proj_notfound",{q})); setReplies([["a_flow_q","flow"],["a_agent","lead"]]); return; }
  const h = hits[0];
  if (h.tier===1){ const p = P.find(x=>x.id===h.id);
    if (p){ addMsg("bot", t("proj_yes",{name:p.name}) + (L==="en" && p.desc ? "\n\n"+p.desc : "")); showCards([{p, s:0, why:[]}]); setReplies([["a_askproj","askproj"],["a_similar","flow"],["card_prices","lead"]]); return; }
    addMsg("bot", t("proj_pending",{name:h.name})); }
  else addMsg("bot", t(h.tier===2 ? "proj_t2" : "proj_t3", {name:h.name}));
  setReplies([["a_alts","flow"],["a_agent","lead"]]);
}
function legalAnswer(topic){
  step = "after";
  addMsg("bot", t("l_"+topic) + "\n\n" + t("l_disclaimer",{date:KB_CHECKED}));
  setReplies([["a_another_legal","legal"],["a_find_homes","flow"],["a_agent","lead"]]);
}

/* ===== Lead capture, one question at a time ===== */
const LEAD = [{k:"name", q:"lead_name", ph:"ph_name"},{k:"phone", q:"lead_phone", ph:"ph_phone"},
  {k:"viewing", q:"lead_view", opts:[["o_v_visit","visit"],["o_v_video","video"],["o_v_here","here"]]},
  {k:"when", q:"lead_when", opts:[["o_morning","morning"],["o_afternoon","afternoon"],["o_evening","evening"],["o_anytime","any"]]}];
let leadI = -1; let lead = {};
function startLead(){ leadI = 0; step = "lead"; askLead(); }
function askLead(){ const Q = LEAD[leadI]; if (!Q) return askConsent(); addMsg("bot", t(Q.q)); if (Q.opts) setReplies(Q.opts); else { setReplies([]); setPh(Q.ph); $("#input").focus(); } }
function leadAnswer(v, label){ addMsg("me", label); lead[LEAD[leadI].k] = v; leadI++; setTimeout(askLead, 200); }
function askConsent(){ step = "consent"; setPh(); addMsg("bot", t("consent")); setReplies([["o_agree","agree"],["o_decline","decline"]]); }
async function finishLead(agree){
  step = "after"; setPh();
  if (!agree){ addMsg("bot", CONFIG.whatsapp ? t("declined_wa",{wa:CONFIG.whatsapp}) : t("declined")); setReplies([["a_keep","flow"]]); return; }
  const rec = {...lead, language:langName(), answers:{...A}, shortlist:(window._ranked||[]).slice(0, window._shown||3).map(r=>r.p.id+" "+r.p.name), consent:"KVKK contact consent v1 ("+L+")", at:new Date().toISOString(),
    questions: turns.filter(x=>x.role==="user").slice(-3).map(x=>x.content.slice(0,300))};
  try{
    const r = await fetch("/api/lead", {method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({...rec, consentGiven:true, consentText:rec.consent, website:($("#hp")||{}).value||""})});
    if (!r.ok) throw 0;
    addMsg("bot", t("thanks",{name:lead.name||""}));
  }catch{ addMsg("bot", CONFIG.whatsapp ? t("save_fail_wa",{wa:CONFIG.whatsapp}) : t("save_fail")); }
  setReplies([["a_ask_another","ask"],["a_new_search","restart"]]);
}

/* ===== Name lookup ===== */
const norm = s => String(s||"").toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/[^a-z0-9]+/g," ").trim();
function lookupName(q){
  const n = norm(q); if (n.length < 3) return [];
  const hit = name => { const m = norm(name); return m && (m.includes(n) || (m.length > 4 && n.includes(m))); };
  const out = [];
  P.forEach(p => { if (hit(p.name)||hit(p.listName)) out.push({tier:1,id:p.id,name:p.name}); });
  NAMES.tier1x.forEach(([id,name]) => { if (hit(name)) out.push({tier:1,id,name}); });
  NAMES.tier2.forEach(([id,name]) => { if (hit(name)) out.push({tier:2,id,name}); });
  NAMES.tier3.forEach(([id,name]) => { if (hit(name)) out.push({tier:3,id,name}); });
  return out.slice(0,8);
}

/* ===== Typed questions go to Claude (via our server; the API key never reaches the browser) ===== */
async function askClaude(text){
  turns.push({role:"user", content:text});
  const out = addMsg("bot", t("typing"));
  $("#send").disabled = true; $("#stop").hidden = false; ctl = new AbortController();
  try{
    const cur = step && S[step] ? EN[val(S[step].say)] : "";
    const shown = (window._ranked||[]).slice(0, window._shown||0).map(r=>r.p.id+" "+r.p.name);
    const r = await fetch("/api/chat", {method:"POST", headers:{"content-type":"application/json"}, signal:ctl.signal,
      body:JSON.stringify({lang:langName(), messages:turns.slice(-10), answers:A, shown, current:cur||""})});
    const j = await r.json().catch(()=>({}));
    if (!r.ok || !j.text) throw {code: r.status===429 ? "rate_limited" : "other"};
    out.textContent = j.text; turns.push({role:"assistant", content:j.text}); scrollDown();
  }catch(e){
    out.remove(); turns.pop();
    const code = e && e.name==="AbortError" ? "cancelled" : e && e.code;
    const m = {rate_limited:"e_rate", cancelled:""}[code] ?? "e_other"; if (m) addMsg("note", t(m));
  }finally{ $("#send").disabled = false; $("#stop").hidden = true; }
}

/* ===== Input handling ===== */
function onReply(btn){
  const v = btn.dataset.v, label = btn.textContent;
  if (step==="lead") return leadAnswer(v, label);
  if (step==="consent"){ addMsg("me", label); return finishLead(v==="agree"); }
  if (step==="results"||step==="after"){ addMsg("me", label); return afterAction(v); }
  const st = S[step]; if (!st) return;
  if (st.multi){
    if (btn.dataset.done){ const sel = [...$("#replies").querySelectorAll('[aria-pressed="true"]')]; return answer(sel.map(b=>b.dataset.v), sel.length ? sel.map(b=>b.textContent).join(L==="ar"||L==="fa"?"، ":", ") : t("nopref")); }
    btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed")!=="true"); return;
  }
  if (v==="__skip") return answer(null, t("skip"));
  answer(v, label);
}
function afterAction(v){
  const r = window._ranked||[];
  if (v==="more"){ const next = r.slice(window._shown, window._shown+3); if (!next.length){ addMsg("bot",t("no_more")); setReplies([["a_agent","lead"],["a_change","change"]]); return; } addMsg("bot",t("more_head")); showCards(next); window._shown += next.length; setReplies([["a_more","more"],["a_compare","compare"],["a_prices","lead"]]); return; }
  if (v==="compare"){ const list = r.slice(0, window._shown).map(x=>x.p);
    addMsg("bot", list.map(p=>`• ${p.name}: ${t("card_from")} ${money(p.fromUSD)||t("price_req")} · ${p.district} · ${p.status||""}${p.delivery?" ("+p.delivery+")":""} · ${p.unitTypes||""}`).join("\n") + "\n\n" + t("compare_q"));
    const r2 = $("#replies"); r2.innerHTML = "";
    list.slice(0,4).forEach(p=>{ const b = document.createElement("button"); b.type="button"; b.className="reply"; b.textContent=p.name.slice(0,28); b.dataset.v="p:"+p.id; r2.append(b); });
    const b = document.createElement("button"); b.type="button"; b.className="reply"; b.textContent=t("a_prices"); b.dataset.v="lead"; r2.append(b); return; }
  if (v.startsWith("p:")){ const p = P.find(x=>x.id===v.slice(2)); if (p) return askClaude(`Tell me more about ${p.name} (${p.id}).`); }
  if (v==="change"){ for (const k of Object.keys(A)) if (k!=="goal") delete A[k]; addMsg("bot",t("change_msg")); return go("budget"); }
  if (v==="widen"){ delete A.budget; delete A.budgetText; return recommend(); }
  if (v==="anyside"){ A.side="any"; delete A.area; return recommend(); }
  if (v==="offplan"){ A.timing="any"; return recommend(); }
  if (v==="lead") return startLead();
  if (v==="notyet"){ addMsg("bot",t("not_yet_msg")); setReplies([["a_more","more"],["a_legal","legal"],["a_new_search","restart"]]); return; }
  if (v==="legal") return go("legal_topic");
  if (v==="flow"){ A.goal = A.goal && A.goal!=="project" && A.goal!=="legal" ? A.goal : "explore"; return go(A.goal==="explore" ? "exp_intro" : "nationality"); }
  if (v==="askproj"){ setReplies([]); setPh("ask_project"); $("#input").focus(); return; }
  if (v==="ask"){ setReplies([]); $("#input").focus(); return; }
  if (v==="restart") return restart();
}
function onText(text){
  text = text.trim(); if (!text) return;
  if (step==="lead"){ if (LEAD[leadI] && !LEAD[leadI].opts) return leadAnswer(text, text); }
  const st = S[step];
  if (st && st.input) return answer(text, text);
  if (step==="budget" && /[\d٠-٩۰-۹]/.test(text)){ A.budget = null; A.budgetText = text; addMsg("me", text); return go("payment"); }
  addMsg("me", text); askClaude(text);
}
function restart(){
  for (const k of Object.keys(A)) delete A[k]; turns.length = 0; window._ranked = null; window._shown = 0; leadI = -1; lead = {};
  $("#log").innerHTML = ""; setPh(); go("start");
}
function applyLang(code, announce){
  L = code; const rtl = L==="ar" || L==="fa";
  document.documentElement.lang = L; document.documentElement.dir = rtl ? "rtl" : "ltr";
  [...$("#lang").children].forEach(x=>x.setAttribute("aria-pressed", x.dataset.l===L));
  $("#tagline").textContent = t("tagline"); $("#restart").textContent = t("restart"); $("#send").textContent = t("send"); $("#stop").textContent = t("stop"); $("#foot").textContent = t("foot");
  try{ localStorage.setItem("iha_lang", L); }catch{}
  restart();
  if (announce) { const n = document.createElement("div"); n.className = "msg note"; n.textContent = t("langSwitched"); $("#log").prepend(n); }
}

/* ===== Boot ===== */
function init(){
  document.title = CONFIG.brand; $("#brandName").textContent = CONFIG.brand;
  $("#lang").innerHTML = LANGS.map(([c,label])=>`<button type="button" data-l="${c}" lang="${c}" aria-pressed="false">${label}</button>`).join("");
  $("#lang").onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.l !== L) applyLang(b.dataset.l, true); };
  $("#replies").onclick = e => { const b = e.target.closest(".reply"); if (b) onReply(b); };
  $("#log").onclick = e => { const c = e.target.closest(".card"); if (!c) return; const p = P.find(x=>x.id===c.dataset.id); if (!p) return;
    if (e.target.closest(".more")){ addMsg("me", t("me_more",{name:p.name})); askClaude(`Tell me more about ${p.name} (${p.id}).`); }
    if (e.target.closest(".agent")){ addMsg("me", t("me_prices",{name:p.name})); lead.interest = p.id+" "+p.name; startLead(); } };
  $("#composer").onsubmit = e => { e.preventDefault(); const v = $("#input").value; $("#input").value = ""; onText(v); };
  $("#input").onkeydown = e => { if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("#composer").requestSubmit(); } };
  $("#stop").onclick = () => ctl?.abort();
  $("#restart").onclick = restart;
}
async function load(){
  let saved = null; try{ saved = localStorage.getItem("iha_lang"); }catch{}
  const nav = (navigator.language||"en").slice(0,2);
  const want = saved || (LANGS.some(x=>x[0]===nav) ? nav : "en");
  try{
    const [d, c] = await Promise.all([
      fetch("/api/data").then(r=>{ if (!r.ok) throw 0; return r.json(); })
        .catch(()=>Promise.all([fetch("data.json").then(r=>r.json()), fetch("names.json").then(r=>r.json())]).then(([projects,names])=>({projects,names}))),
      fetch("i18n.json").then(r=>r.json()).catch(()=>({}))]);
    P = d.projects; if (d.names) NAMES = d.names; if (d.config) Object.assign(CONFIG, d.config); I18N = c || {};
    document.title = CONFIG.brand; $("#brandName").textContent = CONFIG.brand;
  }
  catch{ addMsg("note", t("load_fail")); }
  applyLang(want, false);
}
init(); load();

</script>
